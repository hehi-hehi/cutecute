<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Thiep 20/10</title>
  <link rel="stylesheet" href="flower/flower.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Quicksand:wght@400;600&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --pink-light: #ffe4f0;
      --pink-mid:   #ff85b3;
      --pink-dark:  #e8437a;
      --pink-deep:  #c2185b;
    }

    /* ══════════════════════════════
       PASSWORD SCREEN
    ══════════════════════════════ */
    #lockScreen {
      position: fixed; inset: 0; z-index: 2000;
      background: linear-gradient(160deg, #fce4ec 0%, #f8bbd0 40%, #f48fb1 100%);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      transition: opacity .7s ease, visibility .7s ease;
      overflow: hidden;
    }
    #lockScreen.hide { opacity: 0; visibility: hidden; pointer-events: none; }

    /* canvas hoa roi tren lock */
    #lock-canvas {
      position: absolute; inset: 0;
      pointer-events: none; z-index: 0;
    }

    .lock-box {
      position: relative; z-index: 2;
      background: rgba(255,255,255,.78);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1.5px solid rgba(255,133,179,.35);
      border-radius: 28px;
      padding: 32px 28px 28px;
      width: min(320px, 88vw);
      text-align: center;
      box-shadow: 0 8px 40px rgba(228,67,122,.2);
      animation: popIn .7s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes popIn {
      from { opacity:0; transform: scale(.8) translateY(30px); }
      to   { opacity:1; transform: scale(1)  translateY(0);    }
    }

    .lock-title {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(20px, 6vw, 26px);
      color: var(--pink-dark);
      margin-bottom: 22px;
      font-weight: 700;
    }

    /* Dots hiển thị ký tự đã nhập */
    .pin-dots {
      display: flex; justify-content: center; gap: 14px;
      margin-bottom: 26px;
    }
    .pin-dot {
      width: 16px; height: 16px;
      border-radius: 50%;
      border: 2px solid var(--pink-mid);
      background: transparent;
      transition: background .2s, transform .15s;
    }
    .pin-dot.filled {
      background: var(--pink-dark);
      border-color: var(--pink-dark);
      transform: scale(1.15);
    }
    .pin-dot.error {
      border-color: #e53935;
      background: #e53935;
      animation: shake .4s ease;
    }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%      { transform: translateX(-6px); }
      40%      { transform: translateX(6px); }
      60%      { transform: translateX(-4px); }
      80%      { transform: translateX(4px); }
    }

    /* Lỗi text */
    .pin-error {
      font-size: 13px; font-weight: 600;
      color: #e53935;
      min-height: 18px;
      margin-bottom: 14px;
      transition: opacity .3s;
    }

    /* Bàn phím số */
    .pin-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .pin-key {
      aspect-ratio: 1/1;
      border-radius: 50%;
      border: none;
      background: rgba(255,133,179,.12);
      color: var(--pink-deep);
      font-family: 'Quicksand', sans-serif;
      font-size: clamp(20px, 5.5vw, 26px);
      font-weight: 700;
      cursor: pointer;
      transition: background .15s, transform .12s, box-shadow .15s;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 8px rgba(228,67,122,.1);
      -webkit-tap-highlight-color: transparent;
    }
    .pin-key:hover  { background: rgba(255,133,179,.28); }
    .pin-key:active { transform: scale(.88); background: rgba(228,67,122,.25); }
    .pin-key.del    { font-size: clamp(16px,4.5vw,20px); background: rgba(255,100,100,.1); }
    .pin-key.del:hover { background: rgba(255,100,100,.22); }
    /* 0 nằm giữa hàng cuối */
    .pin-key.zero   { grid-column: 2; }
      --pink-deep:  #c2185b;
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: linear-gradient(160deg, #fce4ec 0%, #f8bbd0 45%, #f48fb1 100%);
      font-family: 'Quicksand', sans-serif;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    /* ══════════════════════════════
       INTRO SCREEN
    ══════════════════════════════ */
    #intro {
      position: fixed; inset: 0; z-index: 3200;
      background: linear-gradient(160deg, #fce4ec 0%, #f8bbd0 35%, #f48fb1 70%, #f06292 100%);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      transition: opacity .9s ease, visibility .9s ease;
      overflow: hidden;
    }
    #intro.hide { opacity: 0; visibility: hidden; pointer-events: none; }

    /* canvas hoa roi tren intro */
    #intro-canvas {
      position: absolute; inset: 0;
      pointer-events: none; z-index: 0;
    }

    .intro-content {
      position: relative; z-index: 2;
      display: flex; flex-direction: column;
      align-items: center;
      padding-bottom: 160px;
    }

    .intro-label {
      font-family: 'Quicksand', sans-serif;
      font-size: clamp(11px, 2.8vw, 14px);
      letter-spacing: .28em; text-transform: uppercase;
      color: var(--pink-deep);
      margin-bottom: 30px;
      animation: fadeUp .9s .2s both;
      text-shadow: 0 1px 4px rgba(255,255,255,.5);
    }
    .intro-label::before { content: '\2022\0020'; }
    .intro-label::after  { content: '\0020\2022'; }

    /* Label slide xuong tu tren */
    .intro-label {
      animation: slideDown .8s cubic-bezier(.22,1,.36,1) .1s both !important;
    }
    @keyframes slideDown {
      from { opacity:0; transform: translateY(-36px); }
      to   { opacity:1; transform: translateY(0); }
    }

    /* Bo hoa – wrapper ngoai zoom in */
    .bouquet-wrap {
      position: relative;
      width: clamp(300px, 72vw, 460px);
      margin-bottom: 38px;
      animation: zoomIn 1s cubic-bezier(.22,1,.36,1) .3s both;
      filter: drop-shadow(0 14px 40px rgba(194,24,91,.45));
    }
    @keyframes zoomIn {
      from { opacity:0; transform: scale(.3) rotate(-10deg); }
      to   { opacity:1; transform: scale(1)  rotate(0deg);   }
    }

    /* Wrapper trong – chi lam nhiem vu lac */
    .bouquet-sway {
      width: 100%;
      transform-origin: center bottom;
      animation: swayBouquet 2.8s ease-in-out infinite;
    }
    @keyframes swayBouquet {
      0%   { transform: rotate(-6deg); }
      50%  { transform: rotate(6deg);  }
      100% { transform: rotate(-6deg); }
    }

    /* vong sang xung quanh bo hoa */
    .bouquet-glow {
      position: absolute;
      inset: -22%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,182,215,.55) 0%, transparent 65%);
      animation: glowPulse 2.4s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes glowPulse {
      0%,100% { transform: scale(1);    opacity:.65; }
      50%      { transform: scale(1.25); opacity:1;  }
    }

    /* sparkles nho */
    .spark {
      position: absolute;
      border-radius: 50%;
      opacity: 0;
      animation: sparkle var(--dur) var(--delay) ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes sparkle {
      0%,100% { opacity:0; transform:scale(0); }
      50%      { opacity:1; transform:scale(1); }
    }

    /* Nut mo thiep – noi bat */
    .btn-open {
      position: relative;
      z-index: 3500;
      font-family: 'Quicksand', sans-serif;
      font-size: clamp(16px, 4.5vw, 20px);
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, #ff4d8d, #c2185b, #e8437a);
      background-size: 200% 200%;
      border: none; border-radius: 99px;
      padding: 17px 58px;
      cursor: pointer;
      letter-spacing: .07em;
      overflow: hidden;
      /* do bong noi bat + ring pulse */
      box-shadow:
        0 0 0 0 rgba(228,67,122,.55),
        0 8px 32px rgba(194,24,91,.5),
        inset 0 1px 0 rgba(255,255,255,.25);
      animation:
        slideUp   .8s cubic-bezier(.22,1,.36,1) .65s both,
        btnPulse  2.2s ease-in-out 1.5s infinite,
        bgShift   3s ease-in-out infinite;
      transition: transform .18s, box-shadow .18s;
    }
    /* shimmer chay qua nut */
    .btn-open::before {
      content: '';
      position: absolute;
      top: 0; left: -75%;
      width: 50%; height: 100%;
      background: linear-gradient(120deg, transparent 0%, rgba(255,255,255,.35) 50%, transparent 100%);
      animation: shimmer 2.8s ease-in-out 1.8s infinite;
      border-radius: 99px;
    }
    @keyframes shimmer {
      0%   { left: -75%; }
      60%  { left: 125%; }
      100% { left: 125%; }
    }
    @keyframes slideUp {
      from { opacity:0; transform: translateY(40px) scale(.85); }
      to   { opacity:1; transform: translateY(0)    scale(1);   }
    }
    @keyframes btnPulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(228,67,122,.55), 0 8px 32px rgba(194,24,91,.5), inset 0 1px 0 rgba(255,255,255,.25); }
      50%      { box-shadow: 0 0 0 12px rgba(228,67,122,0), 0 12px 40px rgba(194,24,91,.65), inset 0 1px 0 rgba(255,255,255,.25); }
    }
    @keyframes bgShift {
      0%,100% { background-position: 0% 50%; }
      50%      { background-position: 100% 50%; }
    }
    .btn-open:hover  { transform: scale(1.09) translateY(-2px); box-shadow: 0 0 0 8px rgba(228,67,122,.15), 0 14px 44px rgba(194,24,91,.6), inset 0 1px 0 rgba(255,255,255,.3); }
    .btn-open:active { transform: scale(.95); }

    @keyframes slideUp {
      from { opacity:0; transform: translateY(40px) scale(.85); }
      to   { opacity:1; transform: translateY(0)    scale(1);   }
    }

    @keyframes fadeUp {
      from { opacity:0; transform:translateY(24px); }
      to   { opacity:1; transform:translateY(0);    }
    }

    /* ══════════════════════════════
       NUT TRAI TIM QUAY LAI
    ══════════════════════════════ */
    #btnBack {
      position: fixed;
      top: 16px; left: 16px;
      z-index: 500;
      width: 46px; height: 46px;
      border-radius: 50%;
      background: rgba(255,255,255,.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1.5px solid rgba(255,133,179,.5);
      box-shadow: 0 3px 16px rgba(228,67,122,.25);
      cursor: pointer;
      display: none;           /* an khi dang o intro */
      align-items: center;
      justify-content: center;
      transition: transform .18s, box-shadow .18s, background .18s;
    }
    #btnBack.visible { display: flex; animation: fadeUp .5s both; }
    #btnBack:hover  { transform: scale(1.12); background: rgba(255,255,255,.95); box-shadow: 0 5px 20px rgba(228,67,122,.4); }
    #btnBack:active { transform: scale(.92); }

    /* canvas hoa roi chinh (nam duoi intro) */
    #petals-canvas {
      position: fixed; inset: 0;
      pointer-events: none; z-index: 0;
    }

    /* ══════════════════════════════
       CARD
    ══════════════════════════════ */
    .card-wrapper {
      position: relative; z-index: 10;
      display: flex; align-items: center; justify-content: center;
      width: 100%; height: 100vh;
      padding: 16px; overflow-y: auto;
    }

    .card {
      background: rgba(255,255,255,.72);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1.5px solid rgba(255,133,179,.4);
      border-radius: 28px;
      box-shadow: 0 8px 40px rgba(228,67,122,.25);
      padding: clamp(20px,5vw,44px) clamp(18px,5vw,48px);
      max-width: 520px; width: 100%;
      text-align: center;
      animation: floatIn 1.2s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes floatIn {
      from { opacity:0; transform:translateY(40px) scale(.95); }
      to   { opacity:1; transform:translateY(0)    scale(1);   }
    }

    .date-badge {
      display: inline-block;
      background: linear-gradient(135deg, var(--pink-mid), var(--pink-dark));
      color:#fff;
      font-size: clamp(11px,3vw,14px);
      font-weight:600; letter-spacing:.12em; text-transform:uppercase;
      padding:5px 18px; border-radius:99px; margin-bottom:16px;
      box-shadow:0 4px 16px rgba(228,67,122,.35);
    }

    .photo-frame {
      margin:0 auto 18px;
      width:clamp(100px,35%,160px); aspect-ratio:1/1;
      border-radius:50%; overflow:hidden;
      border:4px solid var(--pink-mid);
      box-shadow:0 4px 24px rgba(228,67,122,.3);
      background:rgba(255,133,179,.12);
      display:flex; align-items:center; justify-content:center;
    }
    .photo-frame img { width:100%;height:100%;object-fit:cover;display:block; }
    .photo-placeholder { font-size:40px;line-height:1; }

    .main-title {
      font-family:'Dancing Script',cursive;
      font-size:clamp(28px,8vw,52px); line-height:1.15;
      background:linear-gradient(135deg,var(--pink-dark),var(--pink-deep));
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;
      background-clip:text; margin-bottom:8px;
      filter:drop-shadow(0 2px 8px rgba(228,67,122,.2));
    }
    .subtitle {
      font-family:'Dancing Script',cursive;
      font-size:clamp(16px,4.5vw,24px);
      color:var(--pink-dark); margin-bottom:18px;
    }
    .divider {
      display:flex;align-items:center;gap:10px;
      margin:0 auto 16px;max-width:240px;
    }
    .divider hr{flex:1;border:none;border-top:1.5px solid rgba(228,67,122,.3);}
    .divider span{font-size:18px;}

    .message {
      font-size:clamp(12px,3.5vw,15px);
      color:#7a3a55;line-height:1.8;margin-bottom:20px;
    }
    .hearts-row {
      font-size:clamp(20px,5.5vw,28px);
      margin-bottom:20px;
      animation:pulse 1.8s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100%{transform:scale(1);}
      50%{transform:scale(1.1);}
    }

    /* ══════════════════════════════
       FLOATING MUSIC PLAYER
       Hien thi o moi trang, goc duoi
    ══════════════════════════════ */
    #floatPlayer {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3300;
      width: min(360px, 92vw);
      background: linear-gradient(135deg, rgba(255,182,215,.85) 0%, rgba(255,220,235,.9) 100%);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1.5px solid rgba(228,67,122,.3);
      border-radius: 20px;
      padding: 10px 16px 12px;
      box-shadow: 0 8px 32px rgba(228,67,122,.25), 0 0 0 1px rgba(255,255,255,.4);
      transition: opacity .4s, transform .4s;
    }
    #floatPlayer.hidden {
      opacity: 0; pointer-events: none;
      transform: translateX(-50%) translateY(80px);
    }
    /* Toggle show/hide player */
    #btnTogglePlayer {
      position: fixed;
      bottom: 18px; right: 16px;
      z-index: 3301;
      width: 46px; height: 46px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f48fb1, #e8437a);
      border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 18px rgba(228,67,122,.4);
      transition: transform .18s;
    }
    #btnTogglePlayer:hover  { transform: scale(1.1); }
    #btnTogglePlayer:active { transform: scale(.9); }

    .fp-title {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(14px,4vw,18px); font-weight: 700;
      color: #c2185b;
      text-shadow: 0 1px 4px rgba(194,24,91,.2);
      margin-bottom: 8px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      text-align: center;
    }
    .fp-progress {
      display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
    }
    .fp-time { font-size: 11px; font-weight: 600; color: #c2185b; min-width: 28px; }
    .fp-time.right { text-align: right; }
    .fp-bar {
      flex: 1; height: 4px;
      background: rgba(194,24,91,.15);
      border-radius: 99px; position: relative; overflow: hidden; cursor: pointer;
    }
    .fp-fill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #e8437a, #ff85b3);
      border-radius: 99px; transition: width .2s linear; pointer-events: none;
    }
    .fp-bar input[type=range] {
      position: absolute; inset: 0; width: 100%; height: 100%;
      opacity: 0; cursor: pointer; margin: 0;
    }
    .fp-controls { display: flex; align-items: center; justify-content: center; gap: 20px; }
    .fp-btn-prev, .fp-btn-next {
      background: none; border: none; cursor: pointer;
      color: #c2185b; padding: 5px;
      display: flex; align-items: center;
      transition: color .18s, transform .15s;
    }
    .fp-btn-prev:hover,.fp-btn-next:hover { color:#e8437a; transform:scale(1.15); }
    .fp-btn-prev:active,.fp-btn-next:active { transform:scale(.9); }
    .fp-btn-play {
      width: 48px; height: 48px; border-radius: 50%;
      background: linear-gradient(135deg, #e8437a, #c2185b);
      border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 14px rgba(228,67,122,.45);
      transition: transform .15s;
    }
    .fp-btn-play:hover  { transform: scale(1.1); }
    .fp-btn-play:active { transform: scale(.92); }

    /* ══════════════════════════════
       NUT QUAY LAI INTRO -> LOCK
    ══════════════════════════════ */
    #btnBackToLock {
      position: absolute;
      top: 16px; left: 16px; z-index: 1010;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,.22);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      border: 1.5px solid rgba(194,24,91,.35);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background .18s, transform .18s;
      box-shadow: 0 2px 10px rgba(0,0,0,.15);
    }
    #btnBackToLock:hover  { background: rgba(255,255,255,.38); transform: scale(1.1); }
    #btnBackToLock:active { transform: scale(.9); }

    /* ── Trai tim cham ── */
    .touch-heart {
      position:fixed;pointer-events:none;z-index:9999;font-size:28px;
      animation:heartAnim .9s ease-out forwards;
    }
    @keyframes heartAnim {
      0%  {opacity:1;transform:scale(.6) translateY(0);}
      60% {opacity:1;transform:scale(1.3) translateY(-40px);}
      100%{opacity:0;transform:scale(1) translateY(-80px);}
    }

    /* ══════════════════════════════
   MAIN CARD – FLOWER CSS ANIMATION
══════════════════════════════ */
.card-wrapper {
  position:relative; z-index:10;
  display:flex; flex-direction:column;
  align-items:center; justify-content:flex-end;
  width:100%; height:100vh; overflow:hidden;
  perspective:1000px;
}
.card-heading {
  position:absolute; top:clamp(14px,5vw,28px); left:50%; transform:translateX(-50%);
  width:90%; font-family:'Dancing Script',cursive;
  font-size:clamp(19px,5.2vw,32px); color:#fff; text-align:center;
  text-shadow:0 2px 16px rgba(194,24,91,.7),0 0 40px rgba(255,100,180,.4);
  line-height:1.3; z-index:50; pointer-events:none;
}
.card-subheading { display:none; }

/* ── FLOWERS ── */
.flowers { position:relative; transform:scale(0.9); }
@media(max-width:600px){ .flowers{transform:scale(0.62);transform-origin:bottom center;} }
@media(max-height:500px){ .flowers{transform:scale(0.5);} }

.flower { position:absolute; bottom:10vmin; transform-origin:bottom center; z-index:10; --fl-speed:0.3s; }
.flower--1 { animation:moving-flower-1 4s linear infinite; }
.flower--1 .flower__line { height:70vmin; animation-delay:.3s; }
.flower--1 .flower__line__leaf--1{animation:blooming-leaf-right var(--fl-speed) 1.6s backwards}
.flower--1 .flower__line__leaf--2{animation:blooming-leaf-right var(--fl-speed) 1.4s backwards}
.flower--1 .flower__line__leaf--3{animation:blooming-leaf-left  var(--fl-speed) 1.2s backwards}
.flower--1 .flower__line__leaf--4{animation:blooming-leaf-left  var(--fl-speed) 1s   backwards}
.flower--1 .flower__line__leaf--5{animation:blooming-leaf-right var(--fl-speed) 1.8s backwards}
.flower--1 .flower__line__leaf--6{animation:blooming-leaf-left  var(--fl-speed) 2s   backwards}
.flower--2{left:50%;transform:rotate(20deg);animation:moving-flower-2 4s linear infinite}
.flower--2 .flower__line{height:60vmin;animation-delay:.6s}
.flower--2 .flower__line__leaf--1{animation:blooming-leaf-right var(--fl-speed) 1.9s backwards}
.flower--2 .flower__line__leaf--2{animation:blooming-leaf-right var(--fl-speed) 1.7s backwards}
.flower--2 .flower__line__leaf--3{animation:blooming-leaf-left  var(--fl-speed) 1.5s backwards}
.flower--2 .flower__line__leaf--4{animation:blooming-leaf-left  var(--fl-speed) 1.3s backwards}
.flower--3{left:50%;transform:rotate(-15deg);animation:moving-flower-3 4s linear infinite}
.flower--3 .flower__line{animation-delay:.9s}
.flower--3 .flower__line__leaf--1{animation:blooming-leaf-right var(--fl-speed) 2.5s backwards}
.flower--3 .flower__line__leaf--2{animation:blooming-leaf-right var(--fl-speed) 2.3s backwards}
.flower--3 .flower__line__leaf--3{animation:blooming-leaf-left  var(--fl-speed) 2.1s backwards}
.flower--3 .flower__line__leaf--4{animation:blooming-leaf-left  var(--fl-speed) 1.9s backwards}

.flower--4{left:50%;transform:rotate(35deg);animation:moving-flower-4 4s linear infinite}
.flower--4 .flower__line{height:50vmin;animation-delay:1.2s}

/* Phong bi */
.envelope-wrap{position:absolute;bottom:clamp(90px,18vmin,150px);left:0;right:0;margin:0 auto;width:fit-content;z-index:30;cursor:pointer;animation:fadeUp 1.2s 1s both, envelopeFloat 3s ease-in-out 2s infinite;-webkit-tap-highlight-color:transparent}
.envelope-wrap:hover{animation:fadeUp 1.2s 1s both, envelopeHover .4s ease forwards !important}
.envelope-wrap:active{transform:scale(.93)}
@keyframes envelopeFloat{
  0%,100%{transform:translateY(0) rotate(-1deg) scale(1);}
  30%{transform:translateY(-10px) rotate(1deg) scale(1.03);}
  60%{transform:translateY(-6px) rotate(-0.5deg) scale(1.01);}
}
@keyframes envelopeHover{
  0%{transform:translateY(0) scale(1);}
  50%{transform:translateY(-14px) scale(1.12) rotate(2deg);}
  100%{transform:translateY(-10px) scale(1.1) rotate(0deg);}
}

/* Vòng sáng pulse quanh phong bì */
.envelope-wrap::before{
  content:'';
  position:absolute;
  inset:-12px;
  border-radius:18px;
  background:transparent;
  border:2px solid rgba(228,67,122,.4);
  animation:envelopePulse 2s ease-in-out 2s infinite;
  pointer-events:none;
}
.envelope-wrap::after{
  content:'';
  position:absolute;
  inset:-22px;
  border-radius:22px;
  background:transparent;
  border:1.5px solid rgba(228,67,122,.2);
  animation:envelopePulse 2s ease-in-out 2.4s infinite;
  pointer-events:none;
}
@keyframes envelopePulse{
  0%,100%{opacity:0;transform:scale(1);}
  50%{opacity:1;transform:scale(1.06);}
}


/* LETTER OVERLAY */
#letterOverlay{position:fixed;inset:0;z-index:1500;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;visibility:hidden;transition:opacity .5s,visibility .5s}
#letterOverlay.open{opacity:1;visibility:visible}
.letter-box{background:linear-gradient(160deg,#fdf8ec 0%,#fef5e0 55%,#faebd7 100%);border:2px solid rgba(200,155,80,.5);border-radius:20px;box-shadow:0 16px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.9);padding:clamp(22px,6vw,42px) clamp(20px,6vw,44px);max-width:600px;width:100%;text-align:center;position:relative;transform:scale(.85) translateY(30px);transition:transform .5s cubic-bezier(.22,1,.36,1);max-height:88vh;overflow-y:auto}
#letterOverlay.open .letter-box{transform:scale(1) translateY(0)}
.letter-box::before{content:'*';position:absolute;top:11px;left:14px;font-size:17px;color:rgba(180,110,50,.4)}
.letter-box::after{content:'*';position:absolute;top:11px;right:14px;font-size:17px;color:rgba(180,110,50,.4)}
.letter-close{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;background:rgba(228,67,122,.12);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#c2185b;font-size:18px;font-weight:700;transition:background .2s,transform .15s}
.letter-close:hover{background:rgba(228,67,122,.25);transform:scale(1.1)}
.letter-date{display:inline-block;background:linear-gradient(135deg,#e8437a,#c2185b);color:#fff;font-size:clamp(10px,2.8vw,13px);font-weight:600;letter-spacing:.12em;text-transform:uppercase;padding:4px 14px;border-radius:99px;margin-bottom:12px;box-shadow:0 3px 12px rgba(228,67,122,.4)}
.letter-photo{margin:0 auto 12px;width:clamp(80px,26%,120px);aspect-ratio:1/1;border-radius:50%;overflow:hidden;border:3px solid #d4a050;box-shadow:0 4px 16px rgba(0,0,0,.25);background:rgba(255,220,160,.2);display:flex;align-items:center;justify-content:center}
.letter-photo img{width:100%;height:100%;object-fit:cover;display:block}
.letter-photo-ph{font-size:30px;line-height:1}
.letter-title{font-family:'Dancing Script',cursive;font-size:clamp(20px,5.5vw,34px);line-height:1.2;color:#7b3a10;margin-bottom:5px}
.letter-sub{font-family:'Dancing Script',cursive;font-size:clamp(13px,3.5vw,18px);color:#9b4e1a;margin-bottom:12px}
.letter-divider{display:flex;align-items:center;gap:8px;margin:0 auto 12px;max-width:200px}
.letter-divider hr{flex:1;border:none;border-top:1.5px solid rgba(160,100,40,.3)}
.letter-msg{font-size:clamp(12px,3.2vw,14px);color:#5a3010;line-height:1.9;margin-bottom:14px;font-style:italic}
.letter-hearts{font-size:clamp(18px,5vw,24px);animation:pulse 1.8s ease-in-out infinite}

/* Cành lá góc phải */
#rightLeaves {
  position: fixed;
  bottom: 0;
  right: 0;
  pointer-events: none;
  z-index: 5;
  overflow: visible;
}
#rightLeaves .flowers {
  position: absolute;
  bottom: 10vmin;
  right: 10vmin;
  transform: scale(0.9) scaleX(-1) !important;
  transform-origin: bottom right;
}
@keyframes rightLeafSway {
  0%,100% { transform: rotate(0deg); }
  50%      { transform: rotate(2.5deg); }
}

/* Gift falling */
.gift-img {
  position: fixed;
  top: -120px;
  z-index: 2060;
  pointer-events: auto;
  border-radius: 12px;
  border: 3px solid rgba(255,133,179,.5);
  box-shadow: 0 4px 20px rgba(228,67,122,.3);
  animation: giftFall linear forwards;
  object-fit: cover;
  aspect-ratio: 1/1;
  cursor: grab;
  transition: box-shadow .2s, border-color .2s;
}
.gift-img.held {
  animation-play-state: paused !important;
  cursor: grabbing;
  border-color: #e8437a;
  box-shadow: 0 12px 40px rgba(228,67,122,.6), 0 0 0 3px rgba(255,133,179,.4);
  z-index: 3000;
  transition: box-shadow .15s, border-color .15s;
}
.gift-msg {
  position: fixed;
  top: -60px;
  z-index: 2060;
  pointer-events: none;
  font-family: 'Dancing Script', cursive;
  font-weight: 700;
  background: rgba(255,255,255,.88);
  padding: 6px 16px;
  border-radius: 20px;
  border: 2px solid #ffb6c1;
  box-shadow: 0 3px 10px rgba(255,182,193,.4);
  white-space: nowrap;
  animation: giftFall linear forwards;
}
@keyframes giftFall {
  0%   { transform: translateY(0) rotate(0deg);   opacity: 0; }
  8%   { opacity: 1; }
  90%  { opacity: 1; }
  100% { transform: translateY(110vh) rotate(12deg); opacity: 0; }
}

/* Nút tiếp theo */
.letter-next{margin-top:22px;display:flex;flex-direction:column;align-items:center;gap:8px}
.btn-next-page{
  position:relative;
  font-family:'Dancing Script',cursive;
  font-size:clamp(14px,3.5vw,18px);
  font-weight:700;
  color:#fff;
  background:linear-gradient(135deg,#ff4d8d,#e8437a,#c2185b);
  background-size:200% 200%;
  border:none;border-radius:99px;
  padding:10px 32px;
  cursor:pointer;
  letter-spacing:.06em;
  overflow:hidden;
  box-shadow:0 0 0 0 rgba(228,67,122,.5), 0 8px 28px rgba(194,24,91,.45), inset 0 1px 0 rgba(255,255,255,.25);
  animation:btnNextPulse 2s ease-in-out infinite, bgShift 3s ease-in-out infinite;
  transition:transform .18s, box-shadow .18s;
  display:flex;align-items:center;gap:8px;
}
.btn-next-page::before{
  content:'';position:absolute;top:0;left:-75%;
  width:50%;height:100%;
  background:linear-gradient(120deg,transparent,rgba(255,255,255,.35),transparent);
  animation:shimmerBtn 2.5s ease-in-out 1s infinite;
}
@keyframes shimmerBtn{0%{left:-75%}60%{left:125%}100%{left:125%}}
@keyframes btnNextPulse{
  0%,100%{box-shadow:0 0 0 0 rgba(228,67,122,.5),0 8px 28px rgba(194,24,91,.45),inset 0 1px 0 rgba(255,255,255,.25)}
  50%{box-shadow:0 0 0 10px rgba(228,67,122,0),0 12px 36px rgba(194,24,91,.6),inset 0 1px 0 rgba(255,255,255,.25)}
}
.btn-next-page:hover{transform:scale(1.07) translateY(-2px);box-shadow:0 0 0 8px rgba(228,67,122,.15),0 14px 40px rgba(194,24,91,.55),inset 0 1px 0 rgba(255,255,255,.3)}
.btn-next-page:active{transform:scale(.95)}
.btn-next-icon{font-size:1.1em;animation:pulse 1.4s ease-in-out infinite}
.btn-next-hint{font-family:'Quicksand',sans-serif;font-size:12px;font-weight:600;color:rgba(194,24,91,.6);letter-spacing:.08em;animation:pulse 2s ease-in-out infinite}

/* Reveal animation */
.reveal{opacity:0;transform:translateY(18px);transition:opacity .7s ease, transform .7s ease}
.reveal.show{opacity:1;transform:translateY(0)}
#letterText{opacity:0;transition:opacity .3s;font-size:clamp(12px,3.2vw,14px);color:#5a3010;line-height:1.9;margin-bottom:14px;font-style:italic}

<script>
/* ══════════════════════════════
   PASSWORD / LOCK SCREEN
══════════════════════════════ */
const CORRECT_PIN = '8888';
let pinValue = '';

const lockScreen = document.getElementById('lockScreen');
const pinError   = document.getElementById('pinError');
const dots       = [0,1,2,3].map(i => document.getElementById('d'+i));

/* Khai bao som de dung trong checkPin */
const fpEl     = document.getElementById('floatPlayer');
const fpTogBtn = document.getElementById('btnTogglePlayer');
function showPlayer() { fpEl.classList.remove('hidden'); fpTogBtn.style.display='flex'; }
function hidePlayer() { fpEl.classList.add('hidden');    fpTogBtn.style.display='none'; }

function updateDots() {
  dots.forEach((d,i) => {
    d.classList.toggle('filled', i < pinValue.length);
    d.classList.remove('error');
  });
}

function pinPress(num) {
  if (pinValue.length >= 4) return;
  pinValue += num;
  updateDots();
  if (pinValue.length === 4) {
    setTimeout(() => checkPin(), 120);
  }
}

function pinDel() {
  if (pinValue.length === 0) return;
  pinValue = pinValue.slice(0, -1);
  pinError.textContent = '';
  updateDots();
}

function checkPin() {
  if (pinValue === CORRECT_PIN) {
    /* Dung – ẩn lock, hiện intro, hiện player, tự phát nhạc */
    lockScreen.classList.add('hide');
    document.getElementById('intro').classList.remove('hide');
    document.getElementById('btnBack').classList.remove('visible');
    showPlayer();
    /* Tự phát nhạc sau khi transition xong */
    setTimeout(() => {
      audio.play().catch(() => {});
    }, 800);
  } else {
    /* Sai – rung, xoa */
    dots.forEach(d => d.classList.add('error'));
    pinError.textContent = 'M\u1EADt kh\u1EA9u kh\u00F4ng \u0111\u00FAng, th\u1EED l\u1EA1i!';
    setTimeout(() => {
      pinValue = '';
      updateDots();
    }, 700);
  }
}

/* Hoa roi tren lock screen */
(function(){
  const canvas = document.getElementById('lock-canvas');
  const ctx    = canvas.getContext('2d');
  const COLORS = ['#ffffff','#ffe066','#b388ff','#ff1744','#fff9c4','#ce93d8','#ff6d00','#f3e5f5'];
  function resize(){ canvas.width=innerWidth; canvas.height=innerHeight; }
  resize(); window.addEventListener('resize', resize);
  function drawPetal(x,y,r,angle,color,alpha){
    ctx.save(); ctx.globalAlpha=alpha;
    ctx.translate(x,y); ctx.rotate(angle);
    ctx.shadowColor=color; ctx.shadowBlur=isMobile?0:10;
    ctx.beginPath(); ctx.ellipse(0,0,r*.45,r,0,0,Math.PI*2);
    ctx.fillStyle=color; ctx.fill();
    ctx.globalAlpha=alpha*.45;
    ctx.beginPath(); ctx.ellipse(0,-r*.3,r*.18,r*.35,0,0,Math.PI*2);
    ctx.fillStyle='#fff'; ctx.fill();
    ctx.restore();
  }
  const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) || innerWidth < 768;
  const N=Math.min(isMobile?18:50, Math.floor(innerWidth/16));
  function rp(init){
    const r=4+Math.random()*6;
    return{
      x:Math.random()*canvas.width,
      y:init?Math.random()*canvas.height:-r*2,
      r, color:COLORS[Math.floor(Math.random()*COLORS.length)],
      speed:.6+Math.random()*1.1,
      wind:(Math.random()-.5)*.8,
      angle:Math.random()*Math.PI*2,
      spin:(Math.random()-.5)*.05,
      alpha:.6+Math.random()*.4,
      swing:Math.random()*Math.PI*2,
      swingSpeed:.014+Math.random()*.02,
      swingAmp:.7+Math.random()*.9,
    };
  }
  const petals=Array.from({length:N},()=>rp(true));
  function animLock(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    petals.forEach(p=>{
      p.swing+=p.swingSpeed;
      p.x+=p.wind+Math.sin(p.swing)*p.swingAmp;
      p.y+=p.speed; p.angle+=p.spin;
      if(p.y>canvas.height+20) Object.assign(p,rp(false));
      drawPetal(p.x,p.y,p.r,p.angle,p.color,p.alpha);
    });
    requestAnimationFrame(animLock);
  }
  animLock();
})();

/* ══════════════════════════════
   HOA ROI INTRO
   Mau khac tong nen hong:
   trang sua, do tuoi, tim nhat, vang dào
══════════════════════════════ */
(function(){
  const canvas = document.getElementById('intro-canvas');
  const ctx    = canvas.getContext('2d');

  /* Màu nổi bật trên nền hồng pastel */
  const COLORS = [
    '#ffffff',   /* trắng sữa */
    '#ffe066',   /* vàng đào  */
    '#b388ff',   /* tím nhạt  */
    '#ff1744',   /* đỏ tươi   */
    '#fff9c4',   /* vàng kem  */
    '#ce93d8',   /* tím hoa   */
    '#ff6d00',   /* cam đào   */
    '#f3e5f5',   /* trắng tím */
  ];

  function resize(){ canvas.width=innerWidth; canvas.height=innerHeight; }
  resize(); window.addEventListener('resize', resize);

  /* Vẽ cánh hoa có viền mềm */
  function drawPetal(x,y,r,angle,color,alpha){
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(x,y); ctx.rotate(angle);
    /* bóng mờ nổi bật – tắt trên mobile */
    ctx.shadowColor = color;
    ctx.shadowBlur  = isMobile2 ? 0 : 12;
    /* thân cánh */
    ctx.beginPath();
    ctx.ellipse(0, 0, r*0.45, r, 0, 0, Math.PI*2);
    ctx.fillStyle = color;
    ctx.fill();
    /* highlight nhỏ trên đỉnh */
    ctx.globalAlpha = alpha * 0.5;
    ctx.beginPath();
    ctx.ellipse(0, -r*0.3, r*0.18, r*0.35, 0, 0, Math.PI*2);
    ctx.fillStyle = '#fff';
    ctx.fill();
    ctx.restore();
  }

  const isMobile2 = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) || innerWidth < 768;
  const N = Math.min(isMobile2?20:55, Math.floor(innerWidth / 18));

  function rp(init){
    const r = 4 + Math.random() * 6;   /* nhỏ lại: 4-10px */
    return {
      x:     Math.random() * canvas.width,
      y:     init ? Math.random() * canvas.height : -r * 2,
      r,
      color: COLORS[Math.floor(Math.random() * COLORS.length)],
      speed: 0.7 + Math.random() * 1.2,
      wind:  (Math.random() - .5) * 0.9,
      angle: Math.random() * Math.PI * 2,
      spin:  (Math.random() - .5) * 0.05,
      alpha: 0.6 + Math.random() * 0.4,
      swing: Math.random() * Math.PI * 2,
      swingSpeed: 0.015 + Math.random() * 0.022,
      swingAmp:   0.8 + Math.random() * 1.0,
    };
  }

  const petals = Array.from({ length: N }, () => rp(true));

  function animIntro(){
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    petals.forEach(p => {
      p.swing += p.swingSpeed;
      p.x += p.wind + Math.sin(p.swing) * p.swingAmp;
      p.y += p.speed;
      p.angle += p.spin;
      if(p.y > canvas.height + 30) Object.assign(p, rp(false));
      drawPetal(p.x, p.y, p.r, p.angle, p.color, p.alpha);
    });
    requestAnimationFrame(animIntro);
  }
  animIntro();
})();

/* ══════════════════════════════
   SAO DEM – thay the hoa roi tren card chinh
══════════════════════════════ */
(function(){
  const canvas=document.getElementById('petals-canvas');
  const ctx=canvas.getContext('2d');
  function resize(){ canvas.width=innerWidth; canvas.height=innerHeight; }
  resize(); window.addEventListener('resize',resize);

  /* Ve sao 5 canh nho */
  function drawStar(x,y,r,alpha,color){
    ctx.save(); ctx.globalAlpha=alpha;
    ctx.translate(x,y);
    ctx.shadowColor=color; ctx.shadowBlur=isMobile3?0:8;
    ctx.fillStyle=color;
    ctx.beginPath();
    for(let i=0;i<5;i++){
      const a=Math.PI/2+i*Math.PI*2/5;
      const b=a+Math.PI/5;
      if(i===0) ctx.moveTo(Math.cos(a)*r, -Math.sin(a)*r);
      else       ctx.lineTo(Math.cos(a)*r, -Math.sin(a)*r);
      ctx.lineTo(Math.cos(b)*r*.42, -Math.sin(b)*r*.42);
    }
    ctx.closePath(); ctx.fill(); ctx.restore();
  }

  /* Cac hat sao roi nhe */
  const STAR_COLORS=['#ffffff','#ffe8a1','#ffd6ff','#b3e5ff','#ffb3d1','#d4aaff'];
  const isMobile3 = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) || innerWidth < 768;
  const N=Math.min(isMobile3?20:60,Math.floor(innerWidth/14));
  function rs(init){
    const r=2+Math.random()*5;
    return{
      x:Math.random()*canvas.width,
      y:init?Math.random()*canvas.height:-r*2,
      r, color:STAR_COLORS[Math.floor(Math.random()*STAR_COLORS.length)],
      speed:.3+Math.random()*.7,
      wind:(Math.random()-.5)*.5,
      alpha:.5+Math.random()*.5,
      twinkle:Math.random()*Math.PI*2,
      twinkleSpeed:.04+Math.random()*.06,
    };
  }
  const stars=Array.from({length:N},()=>rs(true));

  /* Sao nen bat sanh: co dinh nhieu sao nho */
  const BG=[];
  for(let i=0;i<(isMobile3?40:120);i++){
    BG.push({
      x:Math.random()*2000, y:Math.random()*900,
      r:.8+Math.random()*2,
      color:STAR_COLORS[Math.floor(Math.random()*STAR_COLORS.length)],
      alpha:.3+Math.random()*.7,
      t:Math.random()*Math.PI*2,
      ts:.015+Math.random()*.035,
    });
  }

  function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    /* sao nen nhap nhay */
    BG.forEach(s=>{
      s.t+=s.ts;
      drawStar(s.x % canvas.width, s.y % canvas.height, s.r, s.alpha*(0.5+0.5*Math.sin(s.t)), s.color);
    });
    /* sao roi */
    stars.forEach(s=>{
      s.twinkle+=s.twinkleSpeed;
      s.x+=s.wind; s.y+=s.speed;
      if(s.y>canvas.height+10) Object.assign(s,rs(false));
      drawStar(s.x,s.y,s.r,s.alpha*(0.6+0.4*Math.sin(s.twinkle)),s.color);
    });
    requestAnimationFrame(animate);
  }
  animate();
})();

const letterOverlay = document.getElementById('letterOverlay');
function openLetter() {

  let i = 0;
  let twTimer = null;
  function typeNext() {
    if (i < fullText.length) {
      const ch = fullText[i];
      if (ch === '\n') {
        el.innerHTML += '<br>';

      }
      i++;
      // scroll theo chữ
      el.parentElement.scrollTop = el.parentElement.scrollHeight;
      twTimer = setTimeout(typeNext, 28);
    } else {
      // Hiện tim sau khi gõ xong
      const hearts = letterOverlay.querySelector('.letter-hearts');
      if (hearts) hearts.classList.add('show');
      // Hiện nút tiếp theo
      setTimeout(() => {
        const nextBtn = letterOverlay.querySelector('.letter-next');
        if (nextBtn) nextBtn.classList.add('show');
      }, 500);
    }
  }
  // Bắt đầu sau khi reveal badge xong
  setTimeout(() => { el.style.opacity = 1; typeNext(); }, 700);
}

/* ══════════════════════════════

const TRACKS = [
  { file: 'music/\u0110\u1ebfn Khi N\u00e0o.mp3',                                                                    title: '\u0110\u1ebfn Khi N\u00e0o' },
  { file: 'music/Sao M\u00ecnh Ch\u01b0a N\u0103m Tay Nhau.mp3',                                                      title: 'Sao M\u00ecnh Ch\u01b0a N\u1eafm Tay Nhau' },
  { file: 'music/Ng\u01b0\u1eddi T\u00ecnh M\u00f9a \u0110\u00f4ng.mp3',                                              title: 'Ng\u01b0\u1eddi T\u00ecnh M\u00f9a \u0110\u00f4ng' },
  { file: 'music/I Do.mp3',                                                                                             title: 'I Do' },
  { file: 'music/N\u01a0I N\u00c0Y C\u00d3 ANH _ OFFICIAL MUSIC VIDEO _ S\u01a0N T\u00d9NG M-TP - (320 Kbps).mp3',   title: 'N\u01a1i N\u00e0y C\u00f3 Anh' },
];

let trackIdx=0, isPlaying=false;
const audio     = new Audio();
const fpTitle   = document.getElementById('fpTitle');
const fpSeek    = document.getElementById('fpSeek');
const fpFill    = document.getElementById('fpFill');
const fpNow     = document.getElementById('fpNow');
const fpTot     = document.getElementById('fpTot');
const fpIconPlay  = document.getElementById('fpIconPlay');
const fpIconPause = document.getElementById('fpIconPause');
const floatPlayer = document.getElementById('floatPlayer');

let playerVisible = true;

function togglePlayerUI(){ playerVisible=!playerVisible; floatPlayer.classList.toggle('hidden',!playerVisible); }

function fmt(s){ if(isNaN(s)) return '0:00'; return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'); }

function loadTrack(idx){
  const t=TRACKS[idx];
  audio.src=t.file;
  fpTitle.textContent=t.title;
  fpFill.style.width='0%'; fpSeek.value=0;
  fpNow.textContent='0:00'; fpTot.textContent='0:00';
}
function togglePlay(){
  if(isPlaying){ audio.pause(); }
  else { audio.play().catch(()=>{ fpTitle.textContent='Chua co file nhac'; }); }
}
function setPlayUI(p){
  isPlaying=p;
  fpIconPlay.style.display=p?'none':'block';
  fpIconPause.style.display=p?'block':'none';
}
audio.addEventListener('play', ()=>setPlayUI(true));
audio.addEventListener('pause',()=>setPlayUI(false));
audio.addEventListener('ended',()=>{
  // Tự động chuyển bài tiếp theo và phát luôn
  trackIdx=(trackIdx+1)%TRACKS.length;
  loadTrack(trackIdx);
  audio.play().catch(()=>{});
});

function prevTrack(){
  if(audio.currentTime>3){ audio.currentTime=0; return; }
  trackIdx=(trackIdx-1+TRACKS.length)%TRACKS.length;
  loadTrack(trackIdx); if(isPlaying) audio.play().catch(()=>{});
}
function nextTrack(){
  trackIdx=(trackIdx+1)%TRACKS.length;
  loadTrack(trackIdx); if(isPlaying) audio.play().catch(()=>{});
}
audio.addEventListener('timeupdate',()=>{
  if(!audio.duration) return;
  const pct=(audio.currentTime/audio.duration)*100;
  fpFill.style.width=pct+'%'; fpSeek.value=pct;
  fpNow.textContent=fmt(audio.currentTime);
  fpTot.textContent=fmt(audio.duration);
});
fpSeek.addEventListener('input',()=>{
  if(!audio.duration) return;
  audio.currentTime=(fpSeek.value/100)*audio.duration;
});
loadTrack(0);

function goToGift() {
  // Ẩn letter overlay
  document.getElementById('letterOverlay').classList.remove('open');

  // Hiện gift screen
  const gs = document.getElementById('giftScreen');
  gs.style.display = 'block';
  gs.style.opacity = '0';
  gs.style.transition = 'opacity .6s ease';
  setTimeout(() => gs.style.opacity = '1', 50);

  // Bắt đầu ảnh và lời chúc rơi sau 1s
  setTimeout(() => {
    startGiftFalling();
  }, 1000);
}

function closeGift() {
  const gs = document.getElementById('giftScreen');
  gs.style.opacity = '0';
  setTimeout(() => { gs.style.display = 'none'; }, 600);
  stopGiftFalling();
}

function startGiftFalling() {

  clearInterval(giftMsgInterval);
  // xóa hết ảnh/msg đang rơi
  document.querySelectorAll('.gift-img,.gift-msg').forEach(e => e.remove());

function createGiftImg() {

  const names = [
    'hoa1.jpg','hoa2.jpg','hoa3.jpg','hoa4.jpg','hoa5.jpg',
    'hoa6.jpg','hoa7.jpg','hoa8.jpg','hoa9.jpg','hoa10.jpg',
    'hoa11.jpg','hoa12.jpg','hoa13.jpg','hoa14.jpg','hoa15.jpg',
    'hoa16s.jpg','hoa17s.jpg','hoa18jpg.jpg','hoa19s.jpg','hoa20.jpg'
  ];
  // Dùng đường dẫn tương đối từ vị trí trang index.html
  img.src = `images/${names[Math.floor(Math.random() * names.length)]}`;

  const w = window.innerWidth;
  const size = Math.floor(Math.random() * 80 + 80);

// ── Clone cành lá bên trái sang bên phải (flip) ──
// ── Bông hoa rơi ──
(function(){
  const canvas = document.getElementById('petalCanvas');
  const ctx = canvas.getContext('2d');

  function resize() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  // Các loại bông hoa emoji
  const petals = ['🌸','🌺','🌷','💮','🌼','🩷','💗'];

  class Petal {
    constructor() { this.reset(true); }
    reset(init) {
      this.x    = Math.random() * canvas.width;
      this.y    = init ? Math.random() * -canvas.height : -40;
      this.size = Math.random() * 18 + 12;
      this.speed= Math.random() * 1.2 + 0.4;
      this.wind = Math.random() * 0.8 - 0.4;
      this.rot  = Math.random() * Math.PI * 2;
      this.rotS = (Math.random() - 0.5) * 0.04;
      this.alpha= Math.random() * 0.4 + 0.5;
      this.emoji= petals[Math.floor(Math.random() * petals.length)];
    }
    update() {
      this.y   += this.speed;
      this.x   += this.wind + Math.sin(this.y * 0.015) * 0.6;
      this.rot += this.rotS;
      if (this.y > canvas.height + 40) this.reset(false);
    }
    draw() {
      ctx.save();
      ctx.globalAlpha = this.alpha;
      ctx.translate(this.x, this.y);
      ctx.rotate(this.rot);
      ctx.font = this.size + 'px serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(this.emoji, 0, 0);
      ctx.restore();
    }
  }

  // Tạo 35 bông
  const flowers = Array.from({length: 35}, () => new Petal());

  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    flowers.forEach(p => { p.update(); p.draw(); });
    requestAnimationFrame(animate);
  }
  animate();
})();

// ── 3D drag cho ảnh rơi ──
(function(){
  let held = null, ox = 0, oy = 0;

  document.addEventListener('mousedown', e => {
    if (!e.target.classList.contains('gift-img')) return;
    held = e.target;
    held.classList.add('held');
    const r = held.getBoundingClientRect();
    // Phóng to gấp đôi ngay khi nhấn
    const curW = r.width;
    const curH = r.height;
    held._origW = held.style.width;
    held._origH = held.style.height;
    held.style.width  = (curW * 2) + 'px';
    held.style.height = (curH * 2) + 'px';
    ox = e.clientX - r.left - curW / 2; // căn lại tâm
    oy = e.clientY - r.top  - curH / 2;
    e.preventDefault();
    clearInterval(giftImgInterval);
    giftImgInterval = setInterval(createGiftImg, 500);
  });

  document.addEventListener('mousemove', e => {
    if (!held) return;
    held.style.left = (e.clientX - ox) + 'px';
    held.style.top  = (e.clientY - oy) + 'px';
    const r = held.getBoundingClientRect();
    const dx = (e.clientX - (r.left + r.width/2))  / (r.width/2);
    const dy = (e.clientY - (r.top  + r.height/2)) / (r.height/2);
    held.style.transform = `perspective(800px) rotateX(${-dy*28}deg) rotateY(${dx*28}deg)`;
  });

  document.addEventListener('mouseup', () => {
    if (!held) return;
    held.classList.remove('held');
    held.style.transform = '';
    held.style.width  = held._origW || '';
    held.style.height = held._origH || '';
    held = null;
    clearInterval(giftImgInterval);
    giftImgInterval = setInterval(createGiftImg, 1000);
  });

  // Touch
  document.addEventListener('touchstart', e => {
    if (!e.target.classList.contains('gift-img')) return;
    held = e.target;
    held.classList.add('held');
    const r = held.getBoundingClientRect();
    const curW = r.width;
    const curH = r.height;
    held._origW = held.style.width;
    held._origH = held.style.height;
    held.style.width  = (curW * 2) + 'px';
    held.style.height = (curH * 2) + 'px';
    ox = e.touches[0].clientX - r.left - curW / 2;
    oy = e.touches[0].clientY - r.top  - curH / 2;
    e.preventDefault();
    clearInterval(giftImgInterval);
    giftImgInterval = setInterval(createGiftImg, 500);
  }, { passive: false });

  document.addEventListener('touchmove', e => {
    if (!held) return;
    const tx = e.touches[0].clientX, ty = e.touches[0].clientY;
    held.style.left = (tx - ox) + 'px';
    held.style.top  = (ty - oy) + 'px';
    const r = held.getBoundingClientRect();
    const dx = (tx - (r.left + r.width/2))  / (r.width/2);
    const dy = (ty - (r.top  + r.height/2)) / (r.height/2);
    held.style.transform = `perspective(800px) rotateX(${-dy*28}deg) rotateY(${dx*28}deg)`;
    e.preventDefault();
  }, { passive: false });

  document.addEventListener('touchend', () => {
    if (!held) return;
    held.classList.remove('held');
    held.style.transform = '';
    held.style.width  = held._origW || '';
    held.style.height = held._origH || '';
    held = null;
    clearInterval(giftImgInterval);
    giftImgInterval = setInterval(createGiftImg, 1000);
  });
})();
</script>
